# tonish settings
#
# tonish wrote this file on its first start. Edit it, and tonish applies the
# changes as soon as you save.
# Delete it to get the defaults back on the next start.

# "horizontal" puts the panel along the top of every monitor, "vertical"
# down the left.
orientation = "horizontal"

# How thick the panel is, in pixels.
thickness = 44

# How long the panel is along its edge, in pixels. 0 spans the whole
# monitor; a shorter panel sits in the middle of the edge.
length = 0

# How far the panel keeps from its edge, in pixels.
gap = 0

# How round the panel's corners are, in pixels, up to half its thickness.
# Where a panel shorter than the monitor touches its edge, its corners there
# curve out into the edge instead.
radius = 0
