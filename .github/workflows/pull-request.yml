# A failing job only blocks merging once it is a required status check in a
# ruleset or branch protection rule for main. A job skipped by its
# condition, as "Version raised" is for fix/* branches, counts as passed.
name: Pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request makes the run for the push before it useless.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # As --locked does for cargo: an outdated uv.lock is an error, instead of
  # being rewritten on the runner.
  UV_LOCKED: 1
  # Not the native CPU that .cargo/config.toml asks for: the cache comes back
  # on other runners, whose CPUs may lack its instructions, and rustdoc dies
  # with SIGILL when it loads a proc macro built for one of them.
  RUSTFLAGS: -C target-cpu=x86-64-v2

jobs:
  # Each merge into main is a release, so its version has to be new. Branches
  # named fix/* are exempt: they merge without a release and go out with the
  # next version that is raised.
  version:
    name: Version raised
    if: ${{ !startsWith(github.head_ref, 'fix/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The base branch has to be there to compare against.
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check the version is newer than on ${{ github.base_ref }}
        env:
          BASE: ${{ github.base_ref }}
        run: |
          just version-check "origin/$BASE" || {
            echo "::error file=Cargo.toml::raise the version with just bump, or name the branch fix/..."
            exit 1
          }

  # Every job waits for the version check, so that a forgotten `just bump`
  # stops a pull request before it spends minutes on anything else. The
  # condition lets the job run when the check passed or was skipped, as for
  # fix/* branches: without it, a skipped need would skip this job too.
  lint:
    name: Lint
    needs: version
    if: ${{ !cancelled() && needs.version.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install just, mdBook and uv
        uses: taiki-e/install-action@v2
        with:
          tool: just,mdbook@0.5,uv

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: just lint

      # Here rather than in a job of its own, which would need the toolchain
      # and the cache again.
      - name: Build the docs and the book
        run: just book

  build:
    name: Build
    needs: version
    if: ${{ !cancelled() && needs.version.result != 'failure' }}
    uses: ./.github/workflows/build.yml

  # Runs the packaged binary, so that the desktop tests check what a merge would
  # release and nothing is compiled twice.
  desktop:
    name: Desktop
    needs: build
    # Explicit, because a skipped version check further up would otherwise
    # skip this job as well, even after a successful build.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # grim's screenshots of a failure go through shared memory; the 64 MB
      # a container gets by default is too little for two 4K monitors.
      options: --shm-size=1g
    steps:
      # Mesa by name, because its software renderer stands in for the GPU
      # in the GPU tests, and sway only asks for some OpenGL driver. wtype
      # types the keys of the tests that would otherwise be skipped.
      - name: Install sway, grim, Mesa, wtype, Python and uv
        run: pacman -Syu --noconfirm --needed sway grim mesa wtype python uv > /dev/null

      # sway carries cap_sys_nice; a container may not run a binary with a
      # capability.
      - name: Let sway run in a container
        run: setcap -r /usr/bin/sway || true

      - name: Check out
        uses: actions/checkout@v7

      - name: Fetch the package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: dist

      - name: Unpack
        run: |
          (cd dist && sha256sum --check ./*.sha256)
          mkdir -p target/release
          tar xzf dist/tonish-*.tar.gz --strip-components=1 -C target/release

      - name: Run the desktop tests
        run: uv run pytest -m "not local and not hardware"

      - name: Keep the screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-screenshots
          path: tests/desktop/out
          retention-days: 7
          if-no-files-found: ignore
