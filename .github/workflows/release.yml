# Releasing whenever main has a new version, instead of on tags pushed by
# hand, makes a merge all it takes to ship. A push that keeps the version,
# such as a merged fix/* branch, releases nothing: its changes go out with the
# next version that is raised.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Two merges in quick succession must not race to publish the same release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      new: ${{ steps.tag.outputs.new }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Find the tag
        id: tag
        run: |
          tag="v$(just version)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is released already; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: version
    if: needs.version.outputs.new == 'true'
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the package
        uses: actions/download-artifact@v8
        with:
          name: package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes tonish-*.tar.gz tonish-*.tar.gz.sha256
