[workspace]
resolver = "3"
members = ["crates/renderer", "crates/engine", "crates/tonish"]

[workspace.package]
# name = "tonish"
version = "0.0.2"
edition = "2024"

[workspace.dependencies]
renderer = { path = "crates/renderer" }
engine = { path = "crates/engine" }
calloop = { version = "0.13", features = ["signals"] }
clap = { version = "4.6", features = ["derive"] }
criterion = { version = "0.8.2", default-features = false, features = [
    "cargo_bench_support",
] }
inotify = "0.11"
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = [
    "calloop",
] }
toml = "1.1"
wayland-client = "0.31"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
too_many_arguments = "allow"

[profile.release]
debug = 1
